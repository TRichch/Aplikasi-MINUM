<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>MINUM — Pengingat Obat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2F6F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MINUM">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --sage-50:#F1F7F3;
    --sage-100:#E3EEE7;
    --ink:#1E2A24;
    --ink-soft:#4A5A52;
    --teal:#2F6F5E;
    --teal-dark:#204B40;
    --amber:#E2812E;
    --amber-soft:#FBEBDA;
    --white:#FFFFFF;
    --line:#D9E5DE;
    --danger:#B44B3B;
    --shadow: 0 1px 2px rgba(30,42,36,0.06), 0 4px 14px rgba(30,42,36,0.06);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--sage-50);
    color: var(--ink);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--sage-50);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom: 24px;
  }

  /* ---------- Header ---------- */
  .topbar{
    padding: 22px 20px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:11px;
    background: var(--teal);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:20px;height:20px;}
  .brand-text h1{
    margin:0; font-size:21px; letter-spacing:0.2px; color:var(--teal-dark); font-weight:800;
  }
  .brand-text p{
    margin:0; font-size:11.5px; color:var(--ink-soft); font-weight:600;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line); background:var(--white);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color: var(--ink-soft);
  }

  /* ---------- Banners ---------- */
  .banner{
    margin: 0 20px 14px;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    font-size: 13px;
    line-height:1.45;
    display:flex; gap:10px; align-items:flex-start;
  }
  .banner-info{ background: var(--amber-soft); color:#7A4E17; position:relative; }
  .banner-info button{
    margin-top:6px; border:none; background:var(--amber); color:#fff;
    padding:6px 12px; border-radius:999px; font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .banner-info .close-x{ color:#7A4E17; }
  .banner-install{ background: var(--sage-100); color: var(--teal-dark); position:relative; }
  .banner-install h4{ margin:0 0 6px; font-size:13.5px; }
  .banner-install ol{ margin:0 0 10px; padding-left:18px; font-size:12.5px; line-height:1.6; }
  .banner-install ol:last-of-type{ margin-bottom:0; }
  .banner-install .platform-label{ font-weight:800; font-size:12px; margin:0 0 3px; display:block; }
  .banner-install .close-x{
    position:absolute; top:10px; right:10px; background:none; border:none; color:var(--teal-dark);
    opacity:0.6; cursor:pointer; padding:4px;
  }
  .banner svg{flex-shrink:0; margin-top:1px;}

  /* ---------- Add button ---------- */
  .add-row{ padding: 0 20px 14px; }
  .btn-add{
    width:100%;
    background: var(--teal);
    color:#fff;
    border:none;
    padding:14px 16px;
    border-radius: var(--radius-md);
    font-size:15px;
    font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .btn-add:active{ transform: scale(0.98); }

  /* ---------- Med list ---------- */
  .list{ padding: 0 20px; display:flex; flex-direction:column; gap:12px; flex:1; }
  .empty{
    text-align:center;
    padding: 46px 20px;
    color: var(--ink-soft);
  }
  .empty svg{ margin-bottom: 14px; opacity:0.7; }
  .empty h3{ margin:0 0 6px; color:var(--ink); font-size:16px; }
  .empty p{ margin:0; font-size:13.5px; line-height:1.5; }

  .card{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .card-top{ display:flex; justify-content:space-between; gap:10px; }
  .card-name{ font-size:16px; font-weight:800; color:var(--ink); margin:0 0 3px; }
  .card-dose{ font-size:13px; color:var(--ink-soft); font-weight:600; margin:0; }
  .card-menu{ background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:4px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip{
    font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px;
    background: var(--sage-100); color: var(--teal-dark);
  }
  .chip-time{ background: var(--teal); color:#fff; }
  .card-actions{ display:flex; gap:8px; margin-top:14px; }
  .btn-ghost{
    flex:1; background:none; border:1px solid var(--line); color:var(--ink-soft);
    padding:9px; border-radius:var(--radius-sm); font-weight:700; font-size:13px; cursor:pointer;
  }
  .btn-ghost.danger{ color: var(--danger); border-color:#EFD3CC; }

  /* ---------- Wizard ---------- */
  .wizard{
    position:fixed; inset:0; background: var(--sage-50); z-index:50;
    max-width:480px; margin:0 auto;
    display:flex; flex-direction:column;
  }
  .wiz-head{
    padding: 18px 16px 12px; display:flex; align-items:center; gap:10px;
    border-bottom: 1px solid var(--line); background: var(--white);
  }
  .wiz-back{ background:none; border:none; color:var(--ink); cursor:pointer; padding:6px; }
  .wiz-title{ font-size:15px; font-weight:800; color:var(--ink); flex:1; }
  .wiz-dots{ display:flex; gap:5px; padding: 12px 16px 0; }
  .dot{ height:5px; flex:1; border-radius:3px; background:var(--line); }
  .dot.active{ background: var(--teal); }
  .dot.done{ background: var(--teal); opacity:0.5; }
  .wiz-body{ flex:1; overflow-y:auto; padding: 18px 20px 100px; }
  .wiz-foot{
    position:absolute; bottom:0; left:0; right:0;
    padding: 14px 20px 20px; background: linear-gradient(to top, var(--sage-50) 60%, transparent);
  }
  .step-label{ font-size:19px; font-weight:800; margin:0 0 4px; color:var(--ink); }
  .step-sub{ font-size:13px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5; }

  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--white); border:1.5px solid var(--line); border-radius: var(--radius-md);
    padding: 12px 14px; margin-bottom:14px;
  }
  .search-box input{
    border:none; outline:none; flex:1; font-size:15px; font-family:inherit; background:transparent; color:var(--ink);
  }
  .drug-item{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:13px 14px; margin-bottom:9px; cursor:pointer;
  }
  .drug-item:active{ background: var(--sage-100); }
  .drug-name{ font-weight:800; font-size:14.5px; margin:0 0 2px; }
  .drug-meta{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .manual-link{
    text-align:center; padding:14px; color:var(--teal-dark); font-weight:700; font-size:13.5px;
    text-decoration:underline; cursor:pointer;
  }
  .no-result{ text-align:center; padding:24px 10px; color:var(--ink-soft); font-size:13.5px; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; font-weight:800; color:var(--ink); margin-bottom:7px; }
  .field input[type=text], .field input[type=number], .field select, .field input[type=time], .field input[type=date]{
    width:100%; padding:12px 13px; border-radius: var(--radius-sm); border:1.5px solid var(--line);
    font-size:15px; font-family:inherit; background:var(--white); color:var(--ink);
  }
  .row-2{ display:flex; gap:10px; }
  .row-2 > *{ flex:1; }

  .segmented{ display:flex; background:var(--sage-100); border-radius:999px; padding:4px; margin-bottom:14px; }
  .segmented button{
    flex:1; border:none; background:none; padding:9px 6px; border-radius:999px;
    font-weight:800; font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .segmented button.active{ background:var(--white); color:var(--teal-dark); box-shadow: var(--shadow); }

  .day-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .day-chip{
    padding:9px 0; width:45px; text-align:center; border-radius:10px; border:1.5px solid var(--line);
    background:var(--white); font-size:12.5px; font-weight:800; color:var(--ink-soft); cursor:pointer;
  }
  .day-chip.active{ background:var(--teal); border-color:var(--teal); color:#fff; }

  .time-slot{
    display:flex; align-items:center; gap:10px; background:var(--white); border:1.5px solid var(--line);
    border-radius:var(--radius-sm); padding:11px 13px; margin-bottom:9px;
  }
  .time-slot span{ font-size:13px; font-weight:800; color:var(--ink-soft); min-width:56px; }
  .time-slot input{ border:none; outline:none; font-size:16px; font-family:inherit; flex:1; background:transparent; color:var(--ink); }

  .radio-card{
    display:flex; align-items:center; gap:11px; background:var(--white); border:1.5px solid var(--line);
    border-radius: var(--radius-md); padding:13px 14px; margin-bottom:9px; cursor:pointer;
  }
  .radio-card.active{ border-color:var(--teal); background:var(--sage-100); }
  .radio-dot{ width:18px; height:18px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; position:relative; }
  .radio-card.active .radio-dot{ border-color:var(--teal); }
  .radio-card.active .radio-dot::after{
    content:''; position:absolute; inset:3px; background:var(--teal); border-radius:50%;
  }
  .radio-text{ font-size:14px; font-weight:700; color:var(--ink); }

  .summary-box{ background:var(--white); border:1px solid var(--line); border-radius: var(--radius-lg); padding:16px; }
  .summary-row{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--sage-100); font-size:13.5px; }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .k{ color:var(--ink-soft); font-weight:700; }
  .summary-row .v{ color:var(--ink); font-weight:800; text-align:right; }

  .btn-primary{
    width:100%; background:var(--teal); color:#fff; border:none; padding:15px; border-radius:var(--radius-md);
    font-size:15.5px; font-weight:800; cursor:pointer; box-shadow:var(--shadow);
  }
  .btn-primary:disabled{ opacity:0.45; }
  .btn-primary:active{ transform:scale(0.98); }
  .error-text{ color:var(--danger); font-size:12.5px; font-weight:700; margin-top:6px; }

  /* ---------- Modal / toast ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(30,42,36,0.45); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--white); width:100%; max-width:480px; border-radius: 24px 24px 0 0;
    padding: 22px 20px 28px; box-shadow: 0 -4px 30px rgba(0,0,0,0.2);
  }
  .modal h3{ margin:0 0 8px; font-size:17px; color:var(--ink); }
  .modal p{ margin:0 0 16px; font-size:13.5px; color:var(--ink-soft); line-height:1.55; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{ flex:1; padding:12px; border-radius:var(--radius-sm); font-weight:800; font-size:14px; cursor:pointer; border:none;}
  .modal-cancel{ background:var(--sage-100); color:var(--ink); }
  .modal-confirm{ background:var(--danger); color:#fff; }

  .reminder-toast{
    position:fixed; top:16px; left:16px; right:16px; max-width:448px; margin:0 auto; z-index:200;
    background: var(--teal-dark); color:#fff; border-radius: var(--radius-lg); padding:16px 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    display:flex; gap:12px; align-items:flex-start;
  }
  .reminder-toast .txt{ flex:1; }
  .reminder-toast h4{ margin:0 0 3px; font-size:14.5px; }
  .reminder-toast p{ margin:0; font-size:12.5px; opacity:0.9; }
  .reminder-toast button{
    background:rgba(255,255,255,0.15); border:none; color:#fff; padding:8px 12px; border-radius:999px;
    font-weight:800; font-size:12px; cursor:pointer; flex-shrink:0;
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>

<script>

  /* ================= DATA: contoh obat (BUKAN database resmi lengkap) ================= */
  var DRUG_DB = [

    {name:"Domperidone", brand:"Motilium", dose:"10 mg", form:"tablet"},
    {name:"Antasida DOEN", brand:"Generik", dose:"200 mg", form:"tablet kunyah"},
    {name:"Diapet", brand:"Diapet", dose:"1 kapsul", form:"kapsul"},
    {name:"Oralit", brand:"Generik", dose:"1 sachet", form:"sachet"},
    {name:"Vitamin C", brand:"Generik", dose:"500 mg", form:"tablet"},
    {name:"Vitamin B Complex", brand:"Generik", dose:"1 tablet", form:"tablet"},
    {name:"Vitamin D3", brand:"Generik", dose:"1000 IU", form:"tablet"},
    {name:"Zinc Sulfate", brand:"Generik", dose:"20 mg", form:"tablet"},
    {name:"Salbutamol Inhaler", brand:"Ventolin", dose:"100 mcg/semprot", form:"semprot/inhalasi"},
    {name:"Salbutamol", brand:"Generik", dose:"2 mg", form:"tablet"},
    {name:"Metronidazole", brand:"Generik", dose:"500 mg", form:"tablet"},
    {name:"Ciprofloxacin", brand:"Generik", dose:"500 mg", form:"tablet"},
    {name:"Dexamethasone Tetes Mata", brand:"Generik", dose:"1 tetes", form:"tetes"},
    {name:"Chloramphenicol Salep Mata", brand:"Generik", dose:"1%", form:"lainnya"},
    {name:"Bisacodyl", brand:"Dulcolax", dose:"5 mg", form:"tablet"},
    {name:"Bisacodyl Suppositoria", brand:"Dulcolax", dose:"10 mg", form:"suppositoria"},
    {name:"Aspirin", brand:"Aspilet", dose:"80 mg", form:"tablet"},
    {name:"Clopidogrel", brand:"Plavix", dose:"75 mg", form:"tablet"},
    {name:"Furosemide", brand:"Lasix", dose:"40 mg", form:"tablet"},
    {name:"Allopurinol", brand:"Generik", dose:"100 mg", form:"tablet"},
    {name:"Methylprednisolone", brand:"Medrol", dose:"4 mg", form:"tablet"},
    {name:"Ondansetron", brand:"Generik", dose:"4 mg", form:"tablet"}
  ];

  var FORM_OPTIONS = ["tablet","kapsul","ml","sendok takar","tetes","sachet","suppositoria","semprot/inhalasi","unit (injeksi)","lainnya"];
  var DAY_NAMES = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
  var DAY_FULL = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
  var INSTRUCTION_OPTIONS = [
    {id:"sebelum_makan", label:"Sebelum makan"},
    {id:"saat_makan", label:"Saat makan"},
    {id:"setelah_makan", label:"Setelah makan"},
    {id:"sebelum_tidur", label:"Sebelum tidur"},
    {id:"setelah_bangun", label:"Setelah bangun tidur"}
  ];

  /* ================= STORAGE ================= */
  var storageOk = true;
  function loadMeds(){
    try{
      var raw = localStorage.getItem("minum_meds_v1");
      return raw ? JSON.parse(raw) : [];
    }catch(e){ storageOk = false; return []; }
  }
  function saveMeds(list){
    try{ localStorage.setItem("minum_meds_v1", JSON.stringify(list)); }
    catch(e){ storageOk = false; }
  }
  function loadFired(){
    try{ var raw = localStorage.getItem("minum_fired_v1"); return raw ? JSON.parse(raw) : {}; }
    catch(e){ return {}; }
  }
  function saveFired(obj){
    try{ localStorage.setItem("minum_fired_v1", JSON.stringify(obj)); }catch(e){}
  }

  /* ================= STATE ================= */
  var state = {
    meds: loadMeds(),
    view: "list",          // list | wizard
    step: 1,                // 1..6
    draft: null,
    infoDismissed: false,
    installDismissed: false,
    toast: null,
    confirmDeleteId: null,
    fired: loadFired(),
    showAbout: false,
    notifStatus: (typeof Notification !== "undefined") ? Notification.permission : "unsupported"
  };

  function freshDraft(){
    return {
      id: null,
      name: "", brand: "", form: "tablet",
      doseAmount: "", doseUnit: "tablet",
      periodType: "everyday",   // everyday | custom
      days: [],
      timesPerDay: 1,
      times: [""],
      instruction: "sebelum_makan",
      durationUnit: "hari",
      durationValue: 7,
      startDate: todayISO(),
      searchQuery: ""
    };
  }

  function draftFromMed(med){
    return {
      id: med.id,
      name: med.name, brand: med.brand || "", form: med.doseUnit,
      doseAmount: med.doseAmount, doseUnit: med.doseUnit,
      periodType: med.periodType,
      days: med.days.slice(),
      timesPerDay: med.timesPerDay,
      times: med.times.slice(),
      instruction: med.instruction,
      durationUnit: med.durationUnit,
      durationValue: med.durationValue,
      startDate: med.startDate,
      searchQuery: ""
    };
  }

  function isAndroid(){
    return /Android/i.test(navigator.userAgent || "");
  }
  function buildAlarmIntentUri(hhmm, label){
    var parts = hhmm.split(":");
    var hour = parseInt(parts[0],10);
    var minute = parseInt(parts[1],10);
    if(isNaN(hour) || isNaN(minute)) return null;
    return "intent://setalarm/#Intent;action=android.intent.action.SET_ALARM;S.android.intent.extra.alarm.MESSAGE="+encodeURIComponent(label)+";i.android.intent.extra.alarm.HOUR="+hour+";i.android.intent.extra.alarm.MINUTES="+minute+";end;";
  }
  function pad2gc(n){ return n<10 ? "0"+n : ""+n; }
  function toGCalUTC(d){
    return d.getUTCFullYear()+pad2gc(d.getUTCMonth()+1)+pad2gc(d.getUTCDate())+"T"+pad2gc(d.getUTCHours())+pad2gc(d.getUTCMinutes())+pad2gc(d.getUTCSeconds())+"Z";
  }
  var GCAL_DAY_MAP = {"Sen":"MO","Sel":"TU","Rab":"WE","Kam":"TH","Jum":"FR","Sab":"SA","Min":"SU"};
  function buildGCalLink(med, time){
    var parts = time.split(":");
    var hh = parseInt(parts[0],10), mm = parseInt(parts[1],10);
    if(isNaN(hh) || isNaN(mm)) return null;
    var start = new Date(med.startDate+"T00:00:00");
    start.setHours(hh, mm, 0, 0);
    var end = new Date(start.getTime() + 15*60000);
    var until = new Date(med.endDate+"T23:59:59");
    var recur = "";
    if(med.periodType === "everyday"){
      recur = "RRULE:FREQ=DAILY;UNTIL="+toGCalUTC(until);
    } else if(med.days && med.days.length){
      var byday = med.days.map(function(d){ return GCAL_DAY_MAP[d]; }).join(",");
      recur = "RRULE:FREQ=WEEKLY;BYDAY="+byday+";UNTIL="+toGCalUTC(until);
    }
    var title = encodeURIComponent("Minum " + med.name);
    var details = encodeURIComponent((med.doseAmount||"") + " " + (med.doseUnit||"") + " - " + instructionLabel(med.instruction));
    var url = "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+title+"&dates="+toGCalUTC(start)+"/"+toGCalUTC(end)+"&details="+details;
    if(recur) url += "&recur="+encodeURIComponent(recur);
    return url;
  }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function todayISO(){ var d = new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function addToDate(dateStr, value, unit){
    var d = new Date(dateStr+"T00:00:00");
    if(unit === "hari") d.setDate(d.getDate()+value);
    else if(unit === "minggu") d.setDate(d.getDate()+value*7);
    else if(unit === "bulan") d.setMonth(d.getMonth()+value);
    else if(unit === "tahun") d.setFullYear(d.getFullYear()+value);
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  }
  function durationOptions(unit){
    var max = unit==="hari" ? 31 : unit==="minggu" ? 52 : unit==="bulan" ? 12 : 1;
    var arr = [];
    for(var i=1;i<=max;i++) arr.push(i);
    return arr;
  }
  function instructionLabel(id){
    for(var i=0;i<INSTRUCTION_OPTIONS.length;i++) if(INSTRUCTION_OPTIONS[i].id===id) return INSTRUCTION_OPTIONS[i].label;
    return id;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ================= RENDER ================= */
  var root = document.getElementById("app");

  function render(){
    var html = "";
    if(state.view === "list"){
      html += renderTopbar();

      html += renderAddButton();
      html += renderList();
    } else if(state.view === "wizard"){
      html = renderWizard();
    }
    root.innerHTML = html;
    if(state.toast) html = ""; // placeholder, toast appended separately below
    attachHandlers();
    if(state.toast) renderToastOverlay();
    if(state.confirmDeleteId) renderDeleteModal();
    if(state.showAbout) renderAboutModal();
  }

  function renderWizard(){
    var d = state.draft;
    var stepTitles = ["","Pilih Obat","Dosis","Periode Minum","Frekuensi & Jam","Aturan Minum","Lama Konsumsi"];
    var html = '<div class="wizard">';
    html += '<div class="wiz-head">'+
      '<button class="wiz-back" data-action="wiz-back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#1E2A24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
      '<div class="wiz-title">'+stepTitles[state.step]+'</div>'+
    '</div>';
    html += '<div class="wiz-dots">';
    for(var i=1;i<=6;i++){
      html += '<div class="dot '+(i===state.step?'active':(i<state.step?'done':''))+'"></div>';
    }
    html += '</div>';
    html += '<div class="wiz-body">';

    if(state.step===1) html += renderStep1();
    if(state.step===2) html += renderStep2();
    if(state.step===3) html += renderStep3();
    if(state.step===4) html += renderStep4();
    if(state.step===5) html += renderStep5();
    if(state.step===6) html += renderStep6();

    html += '</div>';

    if(state.step>=2 && state.step<=5){
      var ok = validateStep(state.step);
      html += '<div class="wiz-foot"><button class="btn-primary" data-action="wiz-next" '+(ok?'':'disabled')+'>Lanjut</button></div>';
    }

    html += '</div>';
    return html;
  }

  function renderStep1(){
    var d = state.draft;
    var q = d.searchQuery.trim().toLowerCase();
    var results = q.length===0 ? [] : DRUG_DB.filter(function(item){
      return item.name.toLowerCase().indexOf(q)>-1 || item.brand.toLowerCase().indexOf(q)>-1;
    }).slice(0,20);

    var html = '<p class="step-sub">Ketik nama obat (generik atau merek dagang). Daftar ini adalah contoh umum, bukan basis data resmi lengkap — bila tidak ditemukan, gunakan input manual.</p>';
    html += '<div class="search-box">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#4A5A52" stroke-width="1.8"/><path d="M21 21l-4-4" stroke="#4A5A52" stroke-width="1.8" stroke-linecap="round"/></svg>'+
      '<input type="text" id="drugSearch" placeholder="Contoh: paracetamol, amoxicillin..." value="'+escapeHtml(d.searchQuery)+'">'+
    '</div>';

    if(q.length>0){
      if(results.length===0){
        html += '<div class="no-result">Tidak ditemukan untuk &ldquo;'+escapeHtml(d.searchQuery)+'&rdquo;.</div>';

            '<p class="drug-name">'+escapeHtml(item.name)+' '+escapeHtml(item.dose)+'</p>'+
            '<p class="drug-meta">'+escapeHtml(item.brand)+' &middot; '+escapeHtml(item.form)+'</p>'+
          '</div>';
        });
      }
    }
    html += '<div class="manual-link" data-action="manual-entry">Tidak ditemukan? Input nama obat manual</div>';
    return html;
  }

  function renderStep2(){
    var d = state.draft;
    var html = '<p class="step-sub">Obat terpilih: <strong>'+escapeHtml(d.name)+'</strong>'+(d.brand?' ('+escapeHtml(d.brand)+')':'')+'</p>';
    html += '<div class="field"><label>Nama obat</label><input type="text" id="fieldName" value="'+escapeHtml(d.name)+'" placeholder="Nama obat"></div>';
    html += '<div class="row-2">'+
      '<div class="field"><label>Jumlah dosis</label><input type="number" min="0" step="0.5" id="fieldDoseAmount" value="'+escapeHtml(d.doseAmount)+'" placeholder="cth: 1"></div>'+
      '<div class="field"><label>Satuan</label><select id="fieldDoseUnit">'+

    var html = '<p class="step-sub">Pilih hari obat ini perlu diminum.</p>';
    html += '<div class="segmented">'+
      '<button data-action="set-period" data-val="everyday" class="'+(d.periodType==="everyday"?"active":"")+'">Setiap hari</button>'+
      '<button data-action="set-period" data-val="custom" class="'+(d.periodType==="custom"?"active":"")+'">Hari tertentu</button>'+
    '</div>';

      html += '</div>';
      if(d.days.length===0) html += '<p class="error-text">Pilih minimal satu hari.</p>';

  function renderStep4(){
    var d = state.draft;
    var html = '<p class="step-sub">Berapa kali sehari obat ini diminum? Jam akan menyesuaikan jumlah tersebut.</p>';
    html += '<div class="field"><label>Frekuensi per hari</label><select id="fieldFreq">';

  function renderStep5(){

  function renderStep6(){
    var d = state.draft;
    var html = '<p class="step-sub">Berapa lama obat ini perlu dikonsumsi?</p>';
    html += '<div class="row-2">'+
      '<div class="field"><label>Jumlah</label><select id="fieldDurValue">'+
        durationOptions(d.durationUnit).map(function(n){ return '<option value="'+n+'" '+(d.durationValue==n?"selected":"")+'>'+n+'</option>'; }).join('')+

      '<div class="field"><label>Satuan</label><select id="fieldDurUnit">'+
        ["hari","minggu","bulan","tahun"].map(function(u){ return '<option value="'+u+'" '+(d.durationUnit===u?"selected":"")+'>'+u+'</option>'; }).join('')+
      '</select></div>'+
    '</div>';

    html += '<div class="summary-box">'+
      summaryRow("Obat", d.name + (d.doseAmount? " ("+d.doseAmount+" "+d.doseUnit+")":""))+
      summaryRow("Periode", d.periodType==="everyday" ? "Setiap hari" : d.days.join(", "))+
      summaryRow("Frekuensi", d.timesPerDay + "x sehari")+
      summaryRow("Jam", d.times.slice(0,d.timesPerDay).join(", "))+
      summaryRow("Aturan", instructionLabel(d.instruction))+
      summaryRow("Lama", d.durationValue + " " + d.durationUnit)+

    html += '<div style="height:16px"></div><button class="btn-primary" data-action="finish">'+(d.id ? 'Simpan Perubahan' : 'Selesai &amp; Ingatkan')+'</button>';

  /* ================= EVENT HANDLING ================= */
  function attachHandlers(){
    root.querySelectorAll("[data-action]").forEach(function(elm){
      elm.addEventListener("click", onAction);
    });
    var searchInput = document.getElementById("drugSearch");
    if(searchInput){
      searchInput.addEventListener("input", function(e){
        state.draft.searchQuery = e.target.value;
        render();
        var f = document.getElementById("drugSearch");
        if(f){ f.focus(); f.selectionStart = f.selectionEnd = f.value.length; }
      });
    }
    bindField("fieldName", function(v){ state.draft.name = v; });
    bindField("fieldDoseAmount", function(v){ state.draft.doseAmount = v; });
    bindField("fieldDoseUnit", function(v){ state.draft.doseUnit = v; });
    bindField("fieldFreq", function(v){
      var n = parseInt(v,10);
      state.draft.timesPerDay = n;
      var arr = state.draft.times.slice(0,n);
      while(arr.length<n) arr.push("");
      state.draft.times = arr;
      render();
    });
    bindField("fieldDurUnit", function(v){
      state.draft.durationUnit = v;
      var opts = durationOptions(v);
      if(opts.indexOf(state.draft.durationValue) === -1) state.draft.durationValue = opts[0];
      render();
    });
    bindField("fieldDurValue", function(v){ state.draft.durationValue = parseInt(v,10); });

    root.querySelectorAll(".timeInput").forEach(function(inp){
      inp.addEventListener("change", function(e){
        var idx = parseInt(e.target.getAttribute("data-idx"),10);
        state.draft.times[idx] = e.target.value;
        render();
      });
    });
  }

  function bindField(id, cb){
    var el = document.getElementById(id);
    if(!el) return;
    var evt = (el.tagName==="SELECT") ? "change" : "input";
    el.addEventListener(evt, function(e){ cb(e.target.value); });
  }

  function onAction(e){
    var action = e.currentTarget.getAttribute("data-action");
    switch(action){
      case "open-wizard":
        state.draft = freshDraft();
        state.step = 1;
        state.view = "wizard";
        render();
        break;
      case "edit-med":
        var editId = e.currentTarget.getAttribute("data-id");
        var medToEdit = state.meds.filter(function(mm){ return String(mm.id) === String(editId); })[0];
        if(medToEdit){
          state.draft = draftFromMed(medToEdit);
          state.step = 2;
          state.view = "wizard";
          render();
        }
        break;
      case "wiz-back":
        var firstStep = (state.draft && state.draft.id) ? 2 : 1;
        if(state.step===firstStep){ state.view="list"; render(); }
        else {
          state.step -= 1; render();
        }
        break;
      case "pick-drug":
        var idx = parseInt(e.currentTarget.getAttribute("data-idx"),10);
        var item = DRUG_DB[idx];
        state.draft.name = item.name + " " + item.dose;
        state.draft.brand = item.brand;
        state.draft.doseUnit = normalizeForm(item.form);
        state.draft.doseAmount = "1";
        state.step = 2; render();
        break;
      case "manual-entry":
        state.draft.name = state.draft.searchQuery || "";
        state.draft.brand = "";
        state.step = 2; render();
        break;
      case "set-period":
        state.draft.periodType = e.currentTarget.getAttribute("data-val");
        render();
        break;
      case "toggle-day":
        var day = e.currentTarget.getAttribute("data-day");
        var i = state.draft.days.indexOf(day);
        if(i>-1) state.draft.days.splice(i,1); else state.draft.days.push(day);
        render();
        break;
      case "set-instruction":
        state.draft.instruction = e.currentTarget.getAttribute("data-val");
        render();
        break;
      case "wiz-next":
        if(validateStep(state.step)){
          state.step += 1;
          render();
        }
        break;
      case "finish":
        finishWizard();
        break;
      case "ask-delete":
        state.confirmDeleteId = e.currentTarget.getAttribute("data-id");
        render();
        break;
      case "cancel-delete":
        state.confirmDeleteId = null;
        document.querySelectorAll(".overlay").forEach(function(o){o.remove();});
        break;
      case "close-about":
        state.showAbout = false;
        document.querySelectorAll(".overlay").forEach(function(o){o.remove();});
        break;
      case "confirm-delete":
        state.meds = state.meds.filter(function(m){ return String(m.id) !== String(state.confirmDeleteId); });
        saveMeds(state.meds);
        state.confirmDeleteId = null;
        document.querySelectorAll(".overlay").forEach(function(o){o.remove();});
        render();
        break;
      case "request-permission":
        requestNotifPermission();
        break;
      case "show-about":
        state.showAbout = true;
        render();
        break;
      case "dismiss-install":
        state.installDismissed = true;
        render();
        break;
      case "dismiss-info":
        state.infoDismissed = true;
        render();
        break;
      case "dismiss-toast":
        state.toast = null;
        document.querySelectorAll(".reminder-toast").forEach(function(o){o.remove();});
        break;
    }
  }

  function normalizeForm(f){
    if(FORM_OPTIONS.indexOf(f) > -1) return f;
    if(f.indexOf("ml")>-1) return "ml";
    if(f.indexOf("tetes")>-1) return "tetes";
    if(f.indexOf("semprot")>-1 || f.indexOf("inhal")>-1) return "semprot/inhalasi";
    if(f.indexOf("suppositoria")>-1) return "suppositoria";
    if(f.indexOf("sachet")>-1) return "sachet";
    return "lainnya";
  }

  function validateStep(step){
    var d = state.draft;
    if(step===2) return !!d.doseAmount;
    if(step===3) return d.periodType==="everyday" || d.days.length>0;
    if(step===4) return d.times.slice(0,d.timesPerDay).every(function(t){return !!t;});
    return true;
  }

  function finishWizard(){
    var d = state.draft;
    var med = {
      id: d.id || Date.now(),
      name: d.name || "Obat tanpa nama",
      brand: d.brand,
      doseAmount: d.doseAmount,
      doseUnit: d.doseUnit,
      periodType: d.periodType,
      days: d.periodType==="custom" ? d.days.slice() : [],
      timesPerDay: d.timesPerDay,
      times: d.times.slice(0,d.timesPerDay),
      instruction: d.instruction,
      durationValue: d.durationValue,
      durationUnit: d.durationUnit,
      startDate: d.startDate,
      endDate: addToDate(d.startDate, d.durationValue, d.durationUnit)
    };
    if(d.id){
      state.meds = state.meds.map(function(mm){
        return String(mm.id) === String(d.id) ? med : mm;
      });
    } else {
      state.meds.push(med);
    }
    saveMeds(state.meds);
    state.view = "list";
    render();
    if(!d.id) requestNotifPermission();
  }

  function requestNotifPermission(){
    if(typeof Notification === "undefined"){
      state.notifStatus = "unsupported";
      render();
      return;
    }
    if(Notification.permission === "granted"){
      state.notifStatus = "granted";
      render();
      return;
    }
    if(Notification.permission === "denied"){
      state.notifStatus = "denied";
      render();
      return;
    }
    try{
      var result = Notification.requestPermission(function(perm){
        state.notifStatus = perm;
        render();
      });
      // Modern browsers return a Promise instead of using the callback
      if(result && typeof result.then === "function"){
        result.then(function(perm){
          state.notifStatus = perm;
          render();
        });
      }
    }catch(e){
      state.notifStatus = "unsupported";
      render();
    }
  }

  /* ================= REMINDER ENGINE (berjalan selama halaman ini dibuka) ================= */
  function checkReminders(){
    var now = new Date();
    var hhmm = pad2(now.getHours())+":"+pad2(now.getMinutes());
    var todayName = DAY_NAMES[(now.getDay()+6)%7]; // getDay: 0=Min -> map to Sen..Min index
    var todayIso = todayISO();

    state.meds.forEach(function(m){
      if(todayIso < m.startDate || todayIso > m.endDate) return;
      var activeToday = m.periodType==="everyday" || m.days.indexOf(todayName) > -1;
      if(!activeToday) return;
      m.times.forEach(function(t){
        if(t !== hhmm) return;
        var key = m.id + "_" + todayIso + "_" + t;
        if(state.fired[key]) return;
        state.fired[key] = true;
        saveFired(state.fired);
        fireReminder(m, t);
      });
    });
  }

  function fireReminder(med, time){
    var doseTxt = med.doseAmount + " " + med.doseUnit;
    if(typeof Notification !== "undefined" && Notification.permission === "granted"){
      try{
        new Notification("Waktunya minum obat: " + med.name, {
          body: doseTxt + " · " + instructionLabel(med.instruction) + " · jam " + time,
          tag: med.id + "_" + time
        });
      }catch(e){}
    }
    state.toast = { name: med.name, dose: doseTxt, instruction: med.instruction };
    playBeep();
    render();
  }

  var sharedAudioCtx = null;
  function unlockAudio(){
    try{
      if(!sharedAudioCtx){
        sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(sharedAudioCtx.state === "suspended"){
        sharedAudioCtx.resume();
      }
    }catch(e){}
  }
  // Setiap sentuhan pengguna di mana pun pada aplikasi akan "membuka kunci" audio,
  // supaya nanti saat alarm berbunyi otomatis (tanpa sentuhan), suaranya tetap diizinkan browser.
  document.addEventListener("click", unlockAudio);
  document.addEventListener("touchstart", unlockAudio);

  function playBeep(){
    try{
      unlockAudio();
      if(!sharedAudioCtx) return;
      var ctx = sharedAudioCtx;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.5);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+0.55);
      setTimeout(function(){
        var o2 = ctx.createOscillator(); var g2 = ctx.createGain();
        o2.type="sine"; o2.frequency.value=1046;
        g2.gain.setValueAtTime(0.0001, ctx.currentTime);
        g2.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
        g2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.5);
        o2.connect(g2); g2.connect(ctx.destination);
        o2.start(); o2.stop(ctx.currentTime+0.55);
      }, 350);
    }catch(e){}
  }

  setInterval(checkReminders, 15000);


  /* ================= INIT ================= */
  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(e){});
    });
  }
})();
</script>
